<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asana Clone — Load Failed</title>
  <style>
    :root {
      --bg: #1e1f21; --text: #f5f4f3; --dim: #a2a0a2;
      --border: #424244; --accent: #4573d2; --accent-hover: #5a86db;
      --danger: #e8384f; --card-bg: #2a2b2d;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fff; --text: #1e1f21; --dim: #6d6e6f;
        --border: #e8e8e8; --card-bg: #f9f8f8;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      height: 100vh; -webkit-app-region: drag;
    }
    .container {
      text-align: center; max-width: 420px; padding: 40px;
      -webkit-app-region: no-drag;
    }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), #7a6ff0);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700; color: #fff;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--dim); line-height: 1.5; margin-bottom: 24px; }
    .error-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; margin-bottom: 24px;
      text-align: left; font-size: 12px; color: var(--dim);
    }
    .error-card code { font-family: 'SF Mono', Menlo, monospace; font-size: 11px; }
    .actions { display: flex; gap: 12px; justify-content: center; }
    .btn {
      padding: 10px 24px; border-radius: 6px; border: none;
      cursor: pointer; font-size: 14px; font-weight: 500;
      transition: background .15s, opacity .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: none; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--card-bg); }
    .btn-danger { background: none; border: 1px solid var(--danger); color: var(--danger); }
    .btn-danger:hover { background: rgba(232,56,79,.1); }
    .spinner {
      display: none; width: 20px; height: 20px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .6s linear infinite;
      margin: 16px auto 0;
    }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">!</div>
    <h1>Something went wrong</h1>
    <p>The application failed to load. This could be a temporary issue — try reloading.</p>
    <div class="error-card">
      <div style="margin-bottom:4px;font-weight:500;color:var(--text)">Details</div>
      <code id="error-detail">The renderer process failed to load the main content.</code>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="retry">Retry</button>
      <button class="btn btn-secondary" id="reload">Reload App</button>
      <button class="btn btn-danger" id="quit">Quit</button>
    </div>
    <div class="spinner" id="spinner"></div>
  </div>
  <script>
    const api = window.electronInjectedApi;

    document.getElementById('retry').addEventListener('click', () => {
      document.getElementById('spinner').classList.add('visible');
      if (api?.retryLoadUrl) {
        api.retryLoadUrl();
      } else {
        location.reload();
      }
    });

    document.getElementById('reload').addEventListener('click', () => {
      location.reload();
    });

    document.getElementById('quit').addEventListener('click', () => {
      if (api?.closeWindow) {
        api.closeWindow();
      } else {
        window.close();
      }
    });
  </script>
</body>
</html>
